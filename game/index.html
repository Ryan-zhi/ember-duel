<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Duel — a tiny card battler</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101f; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage" aria-label="Ember Duel: a turn-based card battler against a rival mage"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
